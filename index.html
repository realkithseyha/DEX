<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PhoneDeck">
<meta name="theme-color" content="#050507">
<title>PhoneDeck</title>
<style>
:root { color-scheme: dark; }
html, body { margin: 0; height: 100%; overflow: hidden; color: #f5f5f7; background: #050507;
  background: radial-gradient(ellipse at 0% 0%, rgba(94,92,230,.20), rgba(0,0,0,0) 55%), radial-gradient(ellipse at 100% 100%, rgba(217,119,87,.14), rgba(0,0,0,0) 55%), #050507;
  font: 13px -apple-system, "Helvetica Neue", Roboto, sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: rgba(0,0,0,0); }
#stage { position: absolute; left: 0; top: 0; width: 480px; height: 320px; overflow: hidden; -webkit-transform-origin: 0 0; transform-origin: 0 0; }
#safe { position: fixed; left: 0; top: 0; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
#clock { position: absolute; left: 16px; top: 5px; line-height: 1; }
#time { font: 700 24px -apple-system, "Helvetica Neue", Roboto, sans-serif; letter-spacing: -.6px; }
#ampm { font-size: 10px; font-weight: 700; color: #8e8e93; margin-left: 3px; }
#date { display: block; margin-top: 3px; font-size: 9px; font-weight: 600; letter-spacing: .9px; text-transform: uppercase; color: #8e8e93; }
#keys { position: absolute; top: 52px; width: 316px; }
.key { position: relative; float: left; width: 70px; margin: 0 12px 14px 0; text-align: center; }
.key:nth-child(4n) { margin-right: 0; }
.cap { width: 70px; height: 70px; border-radius: 18px; position: relative; font-size: 34px; line-height: 70px;
  background: linear-gradient(180deg, #303036 0%, #1b1b1f 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.11), 0 3px 0 #0a0a0c, 0 8px 16px rgba(0,0,0,.55); }
.key.down .cap { -webkit-transform: translateY(2px) scale(.97); transform: translateY(2px) scale(.97); }
.key .label { margin-top: 7px; font-size: 10px; font-weight: 500; color: #aeaeb2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.key.empty .cap { background: rgba(255,255,255,.03); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); font-size: 30px; font-weight: 200; color: #636366; }
.key.note .cap { background: linear-gradient(180deg, #e8946f 0%, #c55e39 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 3px 0 #6b2d16, 0 8px 18px rgba(217,119,87,.35); }
.key.note .label { color: #f2b49c; }
.card { position: absolute; border-radius: 18px; box-sizing: border-box; padding: 10px 12px; overflow: hidden; background: rgba(255,255,255,.065); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.12); }
.card h3 { margin: 0 0 5px; font-size: 9.5px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: #8e8e93; }
.big { font-size: 24px; font-weight: 600; letter-spacing: -.8px; line-height: 26px; white-space: nowrap; }
.sub { font-size: 10.5px; color: #c7c7cc; margin-top: 3px; white-space: nowrap; }
.sbtn { display: inline-block; margin: 4px 4px 0 0; padding: 0 9px; height: 24px; line-height: 24px; border-radius: 12px; font-size: 10.5px; font-weight: 600; background: #3a3a3c; }
#timer { padding: 0; }
#tTime { position: absolute; left: 14px; top: 13px; font-size: 24px; font-weight: 600; letter-spacing: -.6px; }
#tBtns { position: absolute; right: 8px; top: 12px; }
#tBtns .sbtn { margin: 0 0 0 4px; height: 28px; line-height: 28px; border-radius: 14px; }
#timer.done { background: rgba(255,69,58,.4); }
.scrim { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(0,0,0,.6); z-index: 10; display: none; }
.scrim.on { display: block; }
.sheet { position: absolute; top: 8px; left: 50%; width: 360px; margin-left: -180px; border-radius: 20px; padding: 13px; box-sizing: border-box; background: #1c1c1e; box-shadow: 0 20px 40px rgba(0,0,0,.6); }
.sheet h2 { margin: 0 0 9px; font-size: 13px; font-weight: 600; }
#noteText { width: 100%; height: 70px; box-sizing: border-box; border: 0; border-radius: 11px; padding: 8px 10px; resize: none; background: #2c2c2e; color: #fff; font: 14px -apple-system, Roboto, sans-serif; -webkit-user-select: text; user-select: text; outline: none; }
.btns { margin-top: 9px; overflow: hidden; }
.btn { float: right; margin-left: 8px; padding: 0 15px; height: 28px; line-height: 28px; border-radius: 14px; font-size: 12px; font-weight: 600; background: #3a3a3c; }
.btn.primary { background: #d97757; }
#pick .sheet { top: 6px; bottom: 6px; padding-bottom: 0; }
#pList { position: absolute; left: 8px; right: 8px; top: 40px; bottom: 0; overflow-y: scroll; -webkit-overflow-scrolling: touch; }
.row { height: 36px; line-height: 36px; border-bottom: .5px solid rgba(255,255,255,.08); font-size: 13px; padding-left: 6px; }
.row b { display: inline-block; width: 30px; font-weight: 400; }
.row.down { background: rgba(255,255,255,.08); }
#pClose { position: absolute; right: 12px; top: 10px; }
#toast { position: absolute; left: 50%; top: 36px; -webkit-transform: translateX(-50%); transform: translateX(-50%); z-index: 20; background: rgba(44,44,46,.95); padding: 6px 12px; border-radius: 12px; font-size: 11px; font-weight: 500; white-space: nowrap; display: none; }
#hint { position: absolute; font-size: 9.5px; color: #48484a; }
</style>
</head>
<body>
<div id="safe"></div>
<div id="stage">
  <div id="toast"></div>
  <div id="clock"><span id="time">–</span><span id="ampm"></span><span id="date"></span></div>
  <div id="keys"></div>
  <div id="timer" class="card"><div id="tTime">Timer</div>
    <div id="tBtns"><span class="sbtn" data-m="5">5m</span><span class="sbtn" data-m="10">10m</span><span class="sbtn" data-m="25">25m</span><span class="sbtn" data-m="0">✕</span></div></div>
  <div id="bat" class="card"><h3>This phone</h3><div class="big" id="bPct">–</div><div class="sub" id="bSub">Battery</div></div>
  <div id="net" class="card"><h3>Network</h3><div class="sub" id="nSub" style="margin:0;font-size:12px">–</div></div>
  <div id="setup" class="card"><h3>Setup</h3><span class="sbtn" id="exp">Export</span><span class="sbtn" id="imp">Import</span></div>

  <div id="noteSheet" class="scrim"><div class="sheet">
    <h2>Take a note <span style="font-weight:400;color:#8e8e93">· starts a new Claude chat</span></h2>
    <textarea id="noteText" placeholder="Type, or tap 🎤 on your keyboard to speak…"></textarea>
    <div class="btns"><div class="btn primary" id="noteGo">Start chat</div><div class="btn" id="noteNo">Cancel</div></div>
  </div></div>

  <div id="pick" class="scrim"><div class="sheet"><h2 id="pTitle">Choose an app</h2><div class="btn" id="pClose">Cancel</div><div id="pList"></div></div></div>
</div>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var isAndroid = /Android/i.test(navigator.userAgent);
  var modern = 'isSecureContext' in window;
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function toast(m) { var t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, 1800); }
  function tap(el, fn, hold) {
    var moved, held, timer;
    el.addEventListener('touchstart', function (e) { moved = held = false; el.className += ' down'; if (hold) timer = setTimeout(function () { held = true; unpress(); hold(e); }, 550); });
    el.addEventListener('touchmove', function () { moved = true; clearTimeout(timer); unpress(); });
    el.addEventListener('touchend', function (e) { e.preventDefault(); clearTimeout(timer); unpress(); if (!moved && !held) fn(e); });
    el.addEventListener('click', function (e) { fn(e); });
    function unpress() { el.className = el.className.replace(/ down/g, ''); }
  }
  function px(el, p) { for (var k in p) el.style[k] = p[k] + 'px'; }

  // ---------- apps: iOS uses app addresses (ios), Android uses intents (and); both fall back to the other ----------
  function I(pkg) { return 'intent://#Intent;package=' + pkg + ';end'; }
  var APPS = [
    { n: 'Phone', e: '📞', ios: 'tel:' }, { n: 'Messages', e: '💬', ios: 'sms:' }, { n: 'Mail', e: '✉️', ios: 'mailto:' },
    { n: 'Maps', e: '🗺️', ios: 'maps://', and: 'geo:0,0?q=' }, { n: 'YouTube', e: '▶️', ios: 'youtube://', and: I('com.google.android.youtube') },
    { n: 'Spotify', e: '🎵', ios: 'spotify://', and: I('com.spotify.music') }, { n: 'WhatsApp', e: '🟢', ios: 'whatsapp://', and: I('com.whatsapp') },
    { n: 'Telegram', e: '✈️', ios: 'tg://', and: I('org.telegram.messenger') }, { n: 'Instagram', e: '📷', ios: 'instagram://', and: I('com.instagram.android') },
    { n: 'Facebook', e: '👍', ios: 'fb://', and: I('com.facebook.katana') }, { n: 'TikTok', e: '🎬', ios: 'snssdk1233://', and: I('com.zhiliaoapp.musically') },
    { n: 'Netflix', e: '🍿', ios: 'nflx://', and: I('com.netflix.mediaclient') }, { n: 'Gmail', e: '📧', ios: 'googlegmail://', and: I('com.google.android.gm') },
    { n: 'Google', e: '🔎', ios: 'https://www.google.com' }, { n: 'Claude', e: '✳️', ios: 'https://claude.ai' }
  ];
  var slots = null;
  try { slots = JSON.parse(store('slots')); } catch (e) {}
  if (!slots || slots.length !== 7) slots = [0, 1, 3, 4, 5, 6, 2].map(function (i) { return APPS[i]; });
  function save() { store('slots', JSON.stringify(slots)); }
  function launch(a) {
    var u = (isAndroid && a.and) || a.ios || a.and || '';
    if (!u || /^\s*(javascript|data|vbscript):/i.test(u)) return toast('Cannot open this key');
    toast('Opening ' + a.n); location.href = u;
  }

  // ---------- layout ----------
  var W = 480, H = 320, portrait = false;
  function fit() {
    var cs = getComputedStyle($('safe')), t = parseFloat(cs.paddingTop) || 0, r = parseFloat(cs.paddingRight) || 0, b = parseFloat(cs.paddingBottom) || 0, l = parseFloat(cs.paddingLeft) || 0;
    var aw = window.innerWidth - l - r, ah = window.innerHeight - t - b;
    portrait = ah > aw * 1.2;
    if (portrait) { W = 360; H = Math.max(520, Math.round(360 * ah / aw)); } else { H = 320; W = Math.max(480, Math.min(760, Math.round(320 * aw / ah))); }
    var s = Math.min(aw / W, ah / H), st = $('stage');
    st.style.width = W + 'px'; st.style.height = H + 'px';
    st.style.webkitTransform = st.style.transform = 'scale(' + s + ')';
    st.style.left = l + (aw - W * s) / 2 + 'px'; st.style.top = t + (ah - H * s) / 2 + 'px';
    if (portrait) {
      var top = Math.max(60, Math.round((H - 470) / 2) + 40), cw = (W - 42) / 2, ct = top + 208 + 4 + 58 + 12;
      px($('keys'), { left: (W - 316) / 2, top: top }); px($('timer'), { left: 16, top: top + 212, width: W - 32, height: 52 });
      px($('bat'), { left: 16, top: ct, width: cw, height: 98 }); px($('net'), { left: 26 + cw, top: ct, width: cw, height: 56 }); px($('setup'), { left: 26 + cw, top: ct + 66, width: cw, height: 78 });
    } else {
      var cwid = W >= 640 ? 150 : 128, cl = W - 16 - cwid, area = cl - 32;
      px($('keys'), { left: 16 + Math.max(0, (area - 316) / 2), top: 52 }); px($('timer'), { left: 16, top: 252, width: Math.max(316, area), height: 52 });
      px($('bat'), { left: cl, top: 52, width: cwid, height: 98 }); px($('net'), { left: cl, top: 160, width: cwid, height: 56 }); px($('setup'), { left: cl, top: 226, width: cwid, height: 78 });
    }
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });

  // ---------- clock ----------
  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function tick() {
    var d = new Date(), m = /(\d{1,2}[:.]\d{2})(?:[:.]\d{2})?\s*([^\d\s]*)/.exec(d.toLocaleTimeString()) || [];
    $('time').textContent = m[1] || (d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2));
    $('ampm').textContent = m[2] || '';
    $('date').textContent = DAYS[d.getDay()] + ' · ' + d.getDate() + ' ' + MON[d.getMonth()];
  }
  setInterval(tick, 10000);

  // ---------- keys ----------
  function mk(cls, label, inner, onTap, onHold) {
    var k = document.createElement('div');
    k.className = 'key ' + cls; k.innerHTML = '<div class="cap"></div><div class="label"></div>';
    k.firstChild.textContent = inner; k.lastChild.textContent = label; tap(k, onTap, onHold); return k;
  }
  function renderKeys() {
    var box = $('keys'); box.innerHTML = '';
    for (var i = 0; i < 7; i++) (function (i, a) {
      if (!a) box.appendChild(mk('empty', 'Add', '+', function () { openPick(i); }, function () { openPick(i); }));
      else box.appendChild(mk('', a.n, a.e, function () { launch(a); }, function () { openPick(i); }));
    })(i, slots[i]);
    box.appendChild(mk('note', 'Take note', '📝', function () { $('noteSheet').className = 'scrim on'; $('noteText').focus(); }));
    var h = $('hint'); if (h) h.parentNode.removeChild(h);
  }
  function openPick(i) {
    var list = $('pList'); list.innerHTML = ''; $('pTitle').textContent = 'Key ' + (i + 1) + ': choose an app';
    function row(e, n, fn) {
      var r = document.createElement('div'); r.className = 'row'; r.innerHTML = '<b></b><span></span>';
      r.firstChild.textContent = e; r.lastChild.textContent = n; tap(r, function () { fn(); }); list.appendChild(r);
    }
    APPS.forEach(function (a) { row(a.e, a.n, function () { slots[i] = a; done(); }); });
    row('🔗', 'Custom link or app address…', function () {
      var u = prompt('Link or app address (https://… or spotify://…)'); if (!u) return;
      var n = prompt('Name for this key') || 'Link';
      slots[i] = { n: n.slice(0, 12), e: '🔗', ios: u, and: u }; done();
    });
    row('✕', 'Empty this key', function () { slots[i] = null; done(); });
    $('pick').className = 'scrim on';
    function done() { save(); renderKeys(); $('pick').className = 'scrim'; }
  }
  tap($('pClose'), function () { $('pick').className = 'scrim'; });

  // ---------- note → Claude chat ----------
  tap($('noteNo'), function () { $('noteText').blur(); $('noteSheet').className = 'scrim'; });
  tap($('noteGo'), function () {
    var t = $('noteText').value.replace(/^\s+|\s+$/g, '');
    if (!t) return toast('Type or speak something first');
    $('noteText').value = ''; $('noteSheet').className = 'scrim';
    location.href = 'https://claude.ai/new?q=' + encodeURIComponent('Note: ' + t);
  });

  // ---------- timer ----------
  var tEnd = 0;
  function tShow() {
    var s = tEnd ? Math.max(0, Math.round((tEnd - Date.now()) / 1000)) : 0;
    $('tTime').textContent = tEnd ? Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2) : 'Timer';
    if (tEnd && s <= 0) {
      tEnd = 0; $('tTime').textContent = 'Done!'; $('timer').className = 'card done';
      if (navigator.vibrate) navigator.vibrate([400, 200, 400]); toast('Time is up!');
      setTimeout(function () { $('timer').className = 'card'; $('tTime').textContent = 'Timer'; }, 4000);
    }
  }
  setInterval(tShow, 500);
  var tb = $('tBtns').children;
  for (var q = 0; q < tb.length; q++) (function (b) {
    tap(b, function () { var m = +b.getAttribute('data-m'); tEnd = m ? Date.now() + m * 60000 : 0; $('timer').className = 'card'; tShow(); });
  })(tb[q]);

  // ---------- battery + network ----------
  if (navigator.getBattery) navigator.getBattery().then(function (b) {
    function upd() { $('bPct').textContent = Math.round(b.level * 100) + '%'; $('bPct').style.color = b.charging ? '#30d158' : b.level <= .2 ? '#ff453a' : ''; $('bSub').textContent = b.charging ? 'Charging' : 'Battery'; }
    upd(); b.addEventListener('levelchange', upd); b.addEventListener('chargingchange', upd);
  }); else $('bSub').textContent = 'Not shown by this browser';
  function net() {
    var c = navigator.connection, on = navigator.onLine !== false;
    $('nSub').textContent = on ? ('● Online' + (c && c.effectiveType ? ' · ' + c.effectiveType : '')) : '● Offline';
    $('nSub').style.color = on ? '#30d158' : '#ff453a';
  }
  window.addEventListener('online', net); window.addEventListener('offline', net); setInterval(net, 5000);

  // ---------- copy your setup to the other phone ----------
  tap($('exp'), function () {
    prompt('Copy this setup code, then tap Import on your other phone and paste it:', btoa(unescape(encodeURIComponent(JSON.stringify(slots)))));
  });
  tap($('imp'), function () {
    var c = prompt('Paste the setup code from your other phone'); if (!c) return;
    try {
      var s = JSON.parse(decodeURIComponent(escape(atob(c.replace(/\s/g, '')))));
      if (!(s instanceof Array) || s.length !== 7) throw 0;
      s.forEach(function (a) { if (a && typeof a.n !== 'string') throw 0; });
      slots = s; save(); renderKeys(); toast('Setup imported');
    } catch (e) { toast('That code did not work'); }
  });

  fit(); tick(); net(); tShow(); renderKeys();
})();
</script>
</body>
</html>
